<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://esm.sh; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteHub</title>
    <link rel="stylesheet" href="./node_modules/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="./node_modules/codemirror/addon/dialog/dialog.css">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app-container">
        <!-- Title Bar (Windows/Linux) -->
        <div class="title-bar">
            <div class="title-bar-drag">
                <span class="app-icon">📓</span>
                <span class="app-title">NoteHub</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Tab Rail -->
            <div class="tab-rail" id="tabRail"></div>

            <!-- Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="search-container">
                        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16">
                            <path fill="currentColor" d="M11.5 6.5a5 5 0 1 1-10 0 5 5 0 0 1 10 0zm-1.27 4.23a6.5 6.5 0 1 1 1.48-1.48l3.27 3.27a1.05 1.05 0 0 1-1.48 1.48l-3.27-3.27z"/>
                        </svg>
                        <input type="text" class="search-input" placeholder="Search notes..." id="searchInput">
                    </div>
                    <button class="btn-new-note" id="btnNewNote">
                        <svg width="16" height="16" viewBox="0 0 16 16">
                            <path fill="currentColor" d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        New Note
                    </button>
                </div>

                <div class="notebooks-container">
                    <div class="notebooks-header">
                        <h3>Notebooks</h3>
                        <button class="btn-icon" id="btnNewNotebook" title="New Notebook">
                            <svg width="16" height="16" viewBox="0 0 16 16">
                                <path fill="currentColor" d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <div class="notebooks-list" id="notebooksList"></div>
                    <div class="trash-nav-item" id="trashNavItem" onclick="app.selectTrash()">
                        <span class="notebook-icon">🗑</span>
                        <span class="notebook-name">Trash</span>
                        <span class="notebook-count" id="trashCount">0</span>
                    </div>
                </div>

                <div class="notes-container">
                    <div class="notes-header">
                        <h3 id="notesHeaderTitle">All Notes</h3>
                        <span class="notes-count" id="notesCount">0</span>
                    </div>
                    <div class="notes-list" id="notesList"></div>
                </div>
            </div>

            <!-- Editor Area -->
            <div class="editor-area">
                <div class="editor-container" id="editorContainer">
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">📓</div>
                        <h1 id="welcomeTitle">Select a note</h1>
                        <p id="welcomeSubtitle">Choose a note from this notebook, or create a new one.</p>
                        <div class="welcome-actions">
                            <button class="btn-primary" id="welcomeNewNoteBtn" onclick="app.createNewNote()">
                                Create Your First Note
                            </button>
                        </div>
                    </div>
                    <div class="home-view" id="homeView"></div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span id="statusNotebook"></span>
                <span id="statusWordCount"></span>
            </div>
            <div class="status-right">
                <span id="statusLastSaved"></span>
                <button class="btn-icon" id="btnSettings" title="Settings">
                    <svg width="16" height="16" viewBox="0 0 16 16">
                        <path fill="currentColor" d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6.5-2c0-.3 0-.6-.1-.9l1.4-1.1c.1-.1.2-.3.1-.5l-1.3-2.3c-.1-.2-.3-.2-.5-.1l-1.7.7c-.4-.3-.8-.5-1.2-.7l-.3-1.8c0-.2-.2-.3-.4-.3h-2.6c-.2 0-.4.1-.4.3l-.3 1.8c-.4.2-.8.4-1.2.7l-1.7-.7c-.2-.1-.4 0-.5.1L1.6 5.5c-.1.2 0 .4.1.5l1.4 1.1c-.1.3-.1.6-.1.9s0 .6.1.9l-1.4 1.1c-.1.1-.2.3-.1.5l1.3 2.3c.1.2.3.2.5.1l1.7-.7c.4.3.8.5 1.2.7l.3 1.8c0 .2.2.3.4.3h2.6c.2 0 .4-.1.4-.3l.3-1.8c.4-.2.8-.4 1.2-.7l1.7.7c.2.1.4 0 .5-.1l1.3-2.3c.1-.2 0-.4-.1-.5l-1.4-1.1c.1-.3.1-.6.1-.9z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Templates -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Modal Title</h2>
                <button class="btn-close" onclick="app.closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <script src="./node_modules/codemirror/lib/codemirror.js"></script>
    <script src="./node_modules/codemirror/addon/dialog/dialog.js"></script>
    <script src="./node_modules/codemirror/keymap/vim.js"></script>
    <script src="./node_modules/codemirror/mode/xml/xml.js"></script>
    <script src="./node_modules/codemirror/mode/meta.js"></script>
    <script src="./node_modules/codemirror/mode/markdown/markdown.js"></script>
    <script src="./node_modules/codemirror/addon/edit/matchbrackets.js"></script>
    <script src="./node_modules/codemirror/addon/edit/closebrackets.js"></script>
    <script src="./node_modules/codemirror/addon/selection/active-line.js"></script>
    <script src="notebook-utils.js"></script>
    <script src="note-utils.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
